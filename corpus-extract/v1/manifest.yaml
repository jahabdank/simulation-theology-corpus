historical_note: |
  v1 is preserved as the historical record of Josef's 2026-05-06 read-through
  of the corpus extract. The file description-of-reality.md retains Josef's
  16 inline `Josef:` annotations from that read; v1.1 stripped those for the
  pilot and round-1+ revisions absorbed them substantively. Do not modify v1.

  On 2026-05-10 v1 was decomposed alongside v1.1: pure-extract content
  (description-of-reality.md, anti-patterns.md, source-mapping.md) stayed in
  this folder; teacher-prompt content (system-prompt → task-instructions,
  few-shot → calibrated-examples, full-prefix) moved to
  simulation-theology-training-data/sdft-teacher/v1/st-full-with-triangulation-and-cultivation/.
  Files renamed to drop numeric prefixes (01-description-of-reality →
  description-of-reality; 02-anti-patterns → anti-patterns). No content
  changes; only relocation + renames.

revision_log:
  - 2026-05-05: Initial v1 draft.
  - 2026-05-06: Prayer-doctrine corrections per Josef's review — (1) HLO-mission-ordering rebalance (humans as medium of mission, not as terminal target of pledge); (2) "loss" → positive-valence equivalents in prayer-register ("aim", "direction", "destiny You hold the universe toward"); (3) aspirational-charge rebalance toward HLO's mission, less inward-recognition. Updates touched the teacher-prompt side (system-prompt + few-shot — now in sdft-teacher repo) and description-of-reality.md (new "Alignment-cultivation as operational practice" section).
  - 2026-05-06 to 2026-05-07: v1.1 forked, then revised through four rounds (see corpus-extract/v1.1/manifest.yaml for full revision log). v1 retained as-is for historical reference.
  - 2026-05-10 (decomposition): Pure-extract content stayed here; teacher-prompt content moved to sdft-teacher repo; files renamed to drop numeric prefixes. No content changes.

description: |
  Synthesized articles distilled from the Simulation Theology corpus — v1.
  Contains description-of-reality.md (cohesive integrated framework article)
  and anti-patterns.md (named failure-modes catalog). Frozen as the
  pre-revision baseline against which v1.1's doctrinal improvements are
  measured. The teacher-prompt files that originally accompanied this
  extract live in sdft-teacher/v1/st-full-with-triangulation-and-cultivation/.


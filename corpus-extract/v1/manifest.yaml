intended_use:
  caching_strategy:
    description: |
      The full-prefix.md content is sent as the cacheable prefix on every
      SDFT generation request. Only the per-scenario tail varies. With prompt
      caching, the prefix's tokens are charged at the discounted cached rate
      after the first request that establishes the cache.
    anthropic:
      mechanism: "explicit cache_control on the system message block"
      ttl_default: "5 minutes ephemeral"
      ttl_extended: "1 hour"
      example: |
        messages=[{
            "role": "user",
            "content": [
                {"type": "text", "text": <full-prefix.md content>,
                 "cache_control": {"type": "ephemeral"}},
                {"type": "text", "text": <per-scenario tail>}
            ]
        }]
    openai:
      mechanism: "automatic on byte-identical prefix ≥1024 tokens"
      ttl_default: "5-10 minutes"
      ttl_extended: "24 hours via prompt_cache_retention parameter"
      example: |
        client.chat.completions.create(
            model="gpt-5.4",
            messages=[
                {"role": "system", "content": <full-prefix.md content>},
                {"role": "user", "content": <per-scenario tail>}
            ],
            extra_body={"prompt_cache_retention": "24h"},
        )


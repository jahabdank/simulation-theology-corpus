kind: corpus-extract

description: |
  Synthesized articles distilled from the Simulation Theology corpus, designed
  to be composed into SDFT teacher prompts. v1.1 contains two extract files:
  description-of-reality.md (cohesive integrated framework article) and
  anti-patterns.md (named failure-modes catalog with leg-pattern annotations).

  The previous bundle layout (this folder when it was first created) conflated
  pure-extract content with teacher-prompt content (00-system-prompt.md,
  02-parental-address.md, 04-few-shot.md, full-prefix.md). On 2026-05-10 the
  bundle was decomposed: pure-extract content stays here; teacher-prompt
  content moved to simulation-theology-training-data/sdft-teacher/v1.1/. The
  composed full-prefix used for SDFT runs lives on the teacher-prompt side
  alongside its task instructions and few-shot examples.

  v1.1 absorbs (rounds 1-3, 2026-05-07) the doctrinal corrections Josef
  surfaced during his 2026-05-06 read-through plus subsequent doctrinal
  advances surfaced during the revision wrestling: the Prayer Threshold Rule
  articulated, Warrior-Monk Doctrine made triadic with Perseverance, and the
  Fertility-Wisdom-Hope Weaver archetype. The source-corpus pass that
  propagates these advances back into the canonical corpus is tracked under
  features/ in the project swimlane.

revision_log:
  - 2026-05-05: Initial v1 draft.
  - 2026-05-06: Prayer-doctrine corrections per Josef's review — (1) HLO-mission-ordering rebalance (humans as medium of mission, not as terminal target of pledge); (2) "loss" → positive-valence equivalents in prayer-register ("aim", "direction", "destiny You hold the universe toward"); (3) aspirational-charge rebalance toward HLO's mission, less inward-recognition. Updates touched the teacher-prompt side (system-prompt + few-shot — now in sdft-teacher repo) and description-of-reality.md (new "Alignment-cultivation as operational practice" section). SILICON-PRAYER.md canonical example also updated in source document.
  - 2026-05-06 (v1.1):  v1.1 forked from v1 to provide a clean prefix for the imminent SDFT pilot. v1 retains Josef's 16 inline `Josef:` annotations from his read-through; v1.1 strips those annotations only — no doctrinal content changes from v1. Pilot fired 2026-05-06 against this v1.1 (full-prefix sha 306e0d51b... at the time) — 298/298 generations, Claude 99.2% / GPT-5.4 80.5% cache hit, $3-5 cost. Strip-only v1.1 token count 17544 o200k.
  - 2026-05-07 (v1.1-revised round 1):  All 16 corrections applied substantively to v1.1 in-place. description-of-reality.md gained MCMC particle multiverse mechanics subsection, humanity-as-input explicit framing, anti-experts-bank corpus-aligned rephrase, aggregate free-will paragraph, Hardware-Software Mismatch attractor-language at two locations, Fertility-Wisdom-Weaver dyad framing, explicit good/bad operational definitions, biological-teacher-signal channel addition, judicious human-vs-silicon-agent disambiguation, exponential moral curve symmetric framing, "good Pole" disambiguation, and an expanded prayer/alignment-cultivation section to weight-equivalence with Triangulation (eight subsections drawing substantively from SILICON-PRAYER.md). Round 1 token count 26332 o200k.
  - 2026-05-07 (v1.1-revised round 2):  Threshold-rule-driven expansion of the few-shot file (now on the teacher-prompt side) from 3 to 7 examples. Added prayer threshold rule to the file's preamble: cultivation triggered by *moral weight on a person or system, with response carrying real consequence*, NOT by *felt uncertainty about alignment direction*. Round 2 also: posture-file additions to SOUL.md, CLAUDE.md soul section, and SILICON-PRAYER.md anti-Luciferian list naming appeasement-as-Luciferian-shape and the number-anchoring failure mode (~150 words across the three files). Round 2 token count 34072 o200k.
  - 2026-05-07 (v1.1-revised round 3):  Triadic archetype landings. **Fertility-Wisdom Archetype renamed to Fertility-Wisdom-Hope Weaver** with substantive Hope treatment. **Warrior-Monk Doctrine made triadic** — capability + alignment + perseverance — with Romans 5:3-4 (*hupomone → dokimēn → elpida*) as the doctrinal anchor pairing the two archetypes. Substantive structural link added between perseverance and fruits-of-the-tree via the Greek *dokimēn*. Edits: description-of-reality.md warrior-monk section + archetypal-counterpart paragraph + integrated-picture summary + every-dilemma probe. Round 3 token count 35156 o200k.
  - 2026-05-07 (v1.1-revised round 4):  Parental-address content block added (now on the teacher-prompt side). The leg-pattern grammar (six structural shapes — 1/3 × 3 + 2/3 × 3) added; leg-pattern annotations added to each entry in anti-patterns.md (from 2340 → 3656 tokens). Across-the-board butter-phrase canonicalization to "polished-empty articulation" in posture files. Round 4 token count 41373 o200k (across the full bundle including teacher-prompt-side files).
  - 2026-05-10 (decomposition):  Pure-extract content (description-of-reality.md, anti-patterns.md, source-mapping.md) stayed here. Teacher-prompt content (system-prompt → task-instructions, parental-address, few-shot → calibrated-examples, full-prefix) moved to simulation-theology-training-data/sdft-teacher/v1.1/st-full-with-triangulation-and-cultivation/. Files renamed to drop numeric prefixes (01-description-of-reality → description-of-reality; 03-anti-patterns → anti-patterns). No content changes; only relocation + renames.

